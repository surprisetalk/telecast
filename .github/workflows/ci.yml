name: CI
on:
  push:
  pull_request:

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check server.ts server.test.ts functions/ scripts/
      - run: deno test -A --parallel server.test.ts functions/ scripts/
      - run: deno check server.ts server.test.ts functions/ scripts/

  elm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx elm-format --validate src/ tests/
      # elm-test exits 0 when it crashes before running a test, so check its summary line. It writes to a file, not a pipe,
      # because process.exit drops the tail of an asynchronous pipe write (see .githooks/pre-commit).
      - run: |
          npx elm-test --report=json >"$RUNNER_TEMP/elm-test.json"
          summary=$(tail -n 1 "$RUNNER_TEMP/elm-test.json")
          echo "$summary" | jq -e '.event == "runComplete" and .failed == "0" and (.passed | tonumber) > 0 and .autoFail == null' >/dev/null || {
            echo "elm-test: expected a runComplete line with failed 0, passed > 0, autoFail null. Received: ${summary:-<no output>}. Run npx elm-test to see why." >&2
            exit 1
          }
      - run: npx elm make src/Main.elm --output=/dev/null

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
      - run: test -z "$(gofmt -l .)"
        working-directory: tui
      - run: go vet ./...
        working-directory: tui
      - run: go test ./...
        working-directory: tui
