name: CI
on:
  push:
  pull_request:

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check functions/ scripts/
      - run: deno test functions/ scripts/
      - run: deno check functions/ scripts/

  elm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx elm-format --validate src/ tests/
      - run: npx elm-test
      - run: npx elm make src/Main.elm --output=/dev/null
