name: Seed
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install
      - run: deno run --allow-net --allow-env --allow-read scripts/seed.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
