<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telecasts</title>
    <meta name="author" content="Taylor Troesh" />
    <meta
      name="description"
      content="A minimalist, free YouTube alternative. Subscribe to any RSS feed — podcasts, YouTube channels, blogs — and watch it all in one place."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#14120e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%23ffa552' transform='translate(50,50)'%3E%3Ccircle r='10'/%3E%3Cpath d='M0-22a22 22 0 0 1 0 44' fill='none' stroke='%23ffa552' stroke-width='6'/%3E%3Cpath d='M0-38a38 38 0 0 1 0 76' fill='none' stroke='%23ffa552' stroke-width='6'/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta property="og:title" content="Telecasts" />
    <meta
      property="og:description"
      content="A minimalist, free YouTube alternative. Subscribe to any RSS feed — podcasts, YouTube channels, blogs — and watch it all in one place."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://telecast.company" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Telecasts" />
    <meta
      name="twitter:description"
      content="A minimalist, free YouTube alternative. Subscribe to any RSS feed — podcasts, YouTube channels, blogs — and watch it all in one place."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/elm.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const KEY = "LIBRARY";

      const defaultLibrary = {
        channels: {},
        episodes: {},
        history: {},
        settings: {},
      };

      // Load library before init so it's available for initial routing
      let library;
      try {
        library = JSON.parse(localStorage.getItem(KEY) || "null") ?? defaultLibrary;
      } catch (error) {
        console.error("Error loading initial library:", error);
        library = defaultLibrary;
      }

      const app = Elm.Main.init({
        node: document.getElementById("app"),
        flags: library,
      });

      // Elm renames an onerror attribute to data-onerror, so thumb errors are caught here. Error and load events do not bubble, so
      // the listeners capture. The thumb proxy answers 503 Busy under load, so a failed thumb waits 3 s and loads once more.
      document.addEventListener(
        "error",
        (event) => {
          const img = event.target;
          if (!(img instanceof HTMLImageElement) || !img.src.includes("/proxy/thumb/")) return;
          if (img.dataset.retried === img.src) {
            img.dataset.thumb = "error";
            console.error(`Expected thumb ${img.src} to load, received an error twice, 3 s apart.`);
            return;
          }
          const src = img.src;
          img.dataset.retried = src;
          img.dataset.thumb = "waiting";
          setTimeout(() => {
            // Elm may have given this element another thumb in the meantime.
            if (img.src === src) img.src = src;
          }, 3000);
        },
        true,
      );
      document.addEventListener(
        "load",
        (event) => {
          if (!(event.target instanceof HTMLImageElement)) return;
          delete event.target.dataset.thumb;
          delete event.target.dataset.retried;
        },
        true,
      );

      app.ports.librarySaving.subscribe((library) => {
        try {
          localStorage.setItem(KEY, JSON.stringify(library));
        } catch (error) {
          console.error("Error saving library:", error);
        }
      });

      document.addEventListener("keydown", (event) => {
        const tag = event.target?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        const player = document.getElementById("player");
        if (!player || typeof player.play !== "function") return;
        if (event.key === " ") {
          event.preventDefault();
          player.paused ? player.play() : player.pause();
        } else if (event.key === "ArrowLeft" && Number.isFinite(player.currentTime)) {
          event.preventDefault();
          player.currentTime = Math.max(0, player.currentTime - 15);
        } else if (event.key === "ArrowRight" && Number.isFinite(player.currentTime)) {
          event.preventDefault();
          player.currentTime = Math.min(player.duration || Infinity, player.currentTime + 15);
        }
      });
    </script>
  </body>
</html>
